<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A brief description of your PortPins website"
    />
    <title>PortPins</title>
    <link rel="icon" type="image/png" href="media/inner.png" />
    <link rel="stylesheet" href="welcome.css" />
    <link rel="stylesheet" href="profile.css" />
    <link rel="stylesheet" href="card.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
  </head>
  
 <header class="header">
      <div class="left-space">
        <button id="back-button" style="display: none">Back</button>
      </div>
      <div id="home-link" class="logo">PortPins</div>
      <div class="profile-icon">
        <i class="fa-solid fa-user user-icon"></i>
      </div>
    </header>
  <main class="profile-container">
    <h1>My Profile</h1>
    <div class="profile-info">
      <img src="default-avatar.jpg" alt="Profile Picture" class="profile-avatar" id="profile-img">
<input type="file" id="image-input" accept="image/*" style="display: none;">
<button id="edit-image-btn">Change Image</button>

      <div class="profile-details">
        <h2 id="user-name">Loading...</h2>
        <p id="user-email"></p>
        <button id="edit-profile-btn">Edit Profile</button>
        <button id="logout-btn">Logout</button>

      </div>
    </div>
    <div class="profile-reviews">
      <h3>My Reviews</h3>
      <ul id="review-list">
        <!-- Reviews will be populated here -->
      </ul>
    </div>
  </main>
  <script src="profile.js"></script>
   <script src="ports.js"></script>
    <script src="details.js"></script>
    <script src="search.js"></script>
  
  </body>
