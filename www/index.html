<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>PortPins</title>
    <link rel="icon" type="image/png" href="media/fav.png" />
    <link rel="stylesheet" href="welcome.css" />
    <link rel="stylesheet" href="card.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="left-space">
        <button id="back-button" style="display: none">Back</button>
      </div>
      <div id="home-link" class="logo">
        <img class="header-logo" src="media/logo.png" alt="" />
      </div>
    </header>

    <div class="hero">
      <h1>WELCOME</h1>
      <p class="tagline">Find what's open when your ship docks</p>

      <div class="search-box">
        <input
          id="search-input"
          type="text"
          placeholder="Where's your ship docking?"
        />
      </div>
    </div>

    <div id="search-results"></div>

    <script src="ports.js"></script>
    <script src="search.js"></script>
    <script src="details.js"></script>
  </body>
</html>
